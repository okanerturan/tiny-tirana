<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- isometric block: top, left, right faces -->
  <path d="M16 2.5 29.5 10 16 17.5 2.5 10Z" fill="#7cb342"/>
  <path d="M2.5 10 16 17.5V29.5L2.5 22Z" fill="#c0533a"/>
  <path d="M29.5 10 16 17.5V29.5L29.5 22Z" fill="#8a3d2c"/>
  <!-- the Pyramid: white, sitting on the top face -->
  <path d="M16 4.6 21.6 11.2 16 14.3 10.4 11.2Z" fill="#fbf8f1"/>
  <path d="M16 4.6 21.6 11.2 16 14.3Z" fill="#d9d2c4"/>
  <!-- one coloured box, the Pyramid's signature -->
  <path d="M19.2 10.3 20.9 11.2 19.2 12.1 17.5 11.2Z" fill="#f2b632"/>
</svg>
